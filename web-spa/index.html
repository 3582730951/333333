<!doctype html>
<html lang="zh-CN" data-theme="light" data-theme-preference="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('pool_theme') || 'auto';
          const resolved = preference === 'auto'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : preference;
          document.documentElement.dataset.theme = resolved === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.themePreference = preference;
        } catch { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230066ff'/%3E%3Cpath d='M21 46V18h13c7 0 12 4 12 11s-5 11-12 11h-6v6h-7Zm7-13h6c3 0 5-1 5-4s-2-4-5-4h-6v8Z' fill='white'/%3E%3C/svg%3E" />
    <title>Pool 控制台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
